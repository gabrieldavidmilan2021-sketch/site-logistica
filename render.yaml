services:
  - type: web
    name: minha-loja
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: DB_PATH
        value: /var/data/loja.db
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
    disk:
      name: loja-dados
      mountPath: /var/data
      sizeGB: 1